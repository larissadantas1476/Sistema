<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Tela de acesso do sistema escolar Colégio Cristal Norte."
    />
    <title>Colégio Cristal Norte | Acesso</title>

    <!-- Pré-conexão para carregar a família tipográfica com mais rapidez. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Camada decorativa usada para reforçar o desfoque do ambiente externo. -->
    <div class="background-scene" aria-hidden="true">
      <div class="scene-sky"></div>
      <div class="scene-building scene-building--left"></div>
      <div class="scene-building scene-building--right"></div>
      <div class="scene-trees"></div>
      <div class="scene-path"></div>
    </div>

    <main class="page-shell">
      <section class="login-card" aria-labelledby="page-title">
        <div class="brand-block">
          <!-- Logo do colégio: substitua o src pelo caminho/nome do seu arquivo. -->
          <div class="brand-mark">
            <img
              src="imagem/logo.jpeg"
              alt="Logo do Colégio Cristal Norte"
              class="brand-logo"
            />
          </div>
          <p class="brand-overline">Sistema escolar</p>
          <h1 id="page-title">Colégio Cristal Norte</h1>
          <p class="brand-subtitle">Educação que ilumina novos caminhos</p>
        </div>

        <div class="card-divider" aria-hidden="true"></div>

        <form class="access-form" id="accessForm" novalidate>
          <fieldset class="form-section">
            <legend>Como você deseja acessar?</legend>
            <p class="section-description">Selecione o seu perfil para continuar.</p>

            <div class="field-group">
              <label for="profile">Perfil de acesso</label>
              <div class="select-wrapper">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <circle cx="12" cy="8" r="3.2" />
                    <path d="M5.5 20c.6-3.4 2.8-5.2 6.5-5.2s5.9 1.8 6.5 5.2" />
                  </svg>
                </span>
                <select
                  id="profile"
                  name="profile"
                  aria-describedby="profileMessage"
                  required
                >
                  <option value="" selected disabled>Selecione um perfil…</option>
                  <option value="aluno">Aluno</option>
                  <option value="responsavel">Responsável</option>
                  <option value="professor">Professor</option>
                  <option value="coordenador">Coordenador</option>
                </select>
                <span class="select-arrow" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <path d="m6 9 6 6 6-6" />
                  </svg>
                </span>
              </div>
              <p class="field-message" id="profileMessage" role="alert"></p>
            </div>
          </fieldset>

          <div class="credentials-section">
            <div class="field-group">
              <label for="identifier" id="identifierLabel">Matrícula ou e-mail</label>
              <div class="input-wrapper">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <circle cx="12" cy="8" r="3.2" />
                    <path d="M5.5 20c.6-3.4 2.8-5.2 6.5-5.2s5.9 1.8 6.5 5.2" />
                  </svg>
                </span>
                <input
                  type="text"
                  id="identifier"
                  name="identifier"
                  autocomplete="username"
                  placeholder="Digite sua matrícula ou e-mail"
                  aria-describedby="identifierMessage"
                  required
                />
              </div>
              <p class="field-message" id="identifierMessage" role="alert"></p>
            </div>

            <div class="field-group">
              <label for="password">Senha</label>
              <div class="input-wrapper">
                <span class="input-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" focusable="false">
                    <rect x="5" y="10" width="14" height="10" rx="2" />
                    <path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v2" />
                  </svg>
                </span>
                <input
                  type="password"
                  id="password"
                  name="password"
                  autocomplete="current-password"
                  placeholder="Digite sua senha"
                  aria-describedby="passwordMessage"
                  required
                />
                <button
                  class="password-toggle"
                  id="passwordToggle"
                  type="button"
                  aria-label="Mostrar senha"
                  aria-pressed="false"
                >
                  <svg class="eye-icon eye-icon--visible" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2.5 12s3.2-5 9.5-5 9.5 5 9.5 5-3.2 5-9.5 5-9.5-5-9.5-5Z" />
                    <circle cx="12" cy="12" r="2.5" />
                  </svg>
                  <svg class="eye-icon eye-icon--hidden" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="m3 3 18 18M10.6 6.2A10.2 10.2 0 0 1 12 6c6.3 0 9.5 6 9.5 6a16 16 0 0 1-3.1 3.7M6.2 6.2C3.9 7.9 2.5 12 2.5 12s3.2 6 9.5 6c1.7 0 3.1-.4 4.3-1" />
                    <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
                  </svg>
                </button>
              </div>
              <p class="field-message" id="passwordMessage" role="alert"></p>
            </div>

            <div class="form-row">
              <label class="remember-me">
                <input type="checkbox" id="remember" name="remember" />
                <span class="custom-checkbox" aria-hidden="true"></span>
                <span>Lembrar de mim</span>
              </label>
              <a class="forgot-link" href="#recuperar-acesso">Esqueci minha senha</a>
            </div>
          </div>

          <button class="submit-button" type="submit">
            <span>Entrar no sistema</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h13M13 6l6 6-6 6" />
            </svg>
          </button>
          <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
        </form>

        <footer class="card-footer">
          <span>Precisa de ajuda?</span>
          <a href="#suporte">Fale com o suporte</a>
        </footer>
      </section>
    </main>

    <script src="storage.js" defer></script>
    <script src="script.js" defer></script>
  </body>
</html>
